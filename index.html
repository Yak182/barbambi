<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" as="image" href="public/gradient-bg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bar Bambi</title>
  </head>
  <body>
  <svg width="0" height="0" style="position:absolute">
      <filter id="outline-white">
          <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
          <feFlood flood-color="white" result="white"/>
          <feComposite in="white" in2="dilated" operator="in" result="filled-outline"/>
          <feComposite in="filled-outline" in2="SourceAlpha" operator="out"/>
      </filter>
      <filter id="outline-black">
          <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="dilated"/>
          <feFlood flood-color="black" result="black"/>
          <feComposite in="black" in2="dilated" operator="in" result="filled-outline"/>
          <feComposite in="filled-outline" in2="SourceAlpha" operator="out"/>
      </filter>
      <filter id="outline-yellow">
          <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="dilated"/>
          <feFlood flood-color="#C8937E" result="color"/>
          <feComposite in="#C8937E" in2="dilated" operator="in" result="filled-outline"/>
          <feComposite in="filled-outline" in2="SourceAlpha" operator="out"/>
      </filter>
  </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
